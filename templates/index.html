<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weed Detection AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="background-decorations">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>
    <div class="container">
        <header>
            <h1>Weed Detection AI</h1>
            <p>Upload a field image and instantly detect weeds using an advanced YOLO state-of-the-art vision model.</p>
        </header>

        <main>
            <div class="upload-card">
                <div class="drop-zone" id="drop-zone">
                    <div class="drop-zone-content">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>Drag and drop image here</p>
                        <span>or</span>
                        <input type="file" id="file-input" accept="image/jpeg, image/png, image/jpg" hidden>
                        <button class="btn browse-btn" onclick="document.getElementById('file-input').click()">Browse Files</button>
                    </div>
                </div>
                
                <div class="preview-section" id="preview-section" style="display: none;">
                    <img id="image-preview" src="" alt="Preview">
                    <button class="btn scan-btn" id="scan-btn">Scan for Weeds <span class="loader" style="display: none;"></span></button>
                </div>
            </div>

            <div class="results-card" id="results-card" style="display: none;">
                <h2>Detection Results</h2>
                <div class="stats-row">
                    <div class="stat-box">
                        <h3>Status</h3>
                        <p class="status-success">Analyzed</p>
                    </div>
                    <div class="stat-box">
                        <h3>Weeds Detected</h3>
                        <p class="count" id="weed-count">0</p>
                    </div>
                </div>
                <div class="result-image-container">
                    <img id="result-image" src="" alt="Detection Results">
                </div>
                <button class="btn reset-btn" id="reset-btn">Scan Another Image</button>
            </div>
        </main>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
